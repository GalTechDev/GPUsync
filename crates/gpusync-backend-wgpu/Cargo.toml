[package]
name = "gpusync-backend-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
gpusync-runtime.workspace = true
pollster = "1.0.3"
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }

# Zéro-copie Metal (newBufferWithBytesNoCopy) via wgpu-hal : mêmes versions que wgpu-hal 30.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-metal = { version = "0.3", default-features = false, features = ["std", "block2", "MTLAllocation", "MTLBuffer", "MTLResource", "MTLDevice"] }
