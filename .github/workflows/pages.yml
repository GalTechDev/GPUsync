# Site de documentation : docs/pages publié sur GitHub Pages (Settings → Pages → Source : GitHub Actions).
# docs/pages est généré depuis docs/*.md par tools/build_pages.py ; le site publié est régénéré ici, et la
# version committée doit être à jour (tests/test_docs.py le vérifie aussi).

name: Pages

on:
  push:
    branches: [main, new-rust]
    paths: ["docs/**", "tools/build_pages.py", "Cargo.toml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: docs/pages à jour
        run: python tools/build_pages.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/pages
      - id: deployment
        uses: actions/deploy-pages@v4
