# Continuous integration: tests on the three systems, wheels of gpusync (one per system, abi3: Python ≥ 3.10)
# and of gpusync-gfx (pure Python). GitHub machines have no compute GPU: the tests go through the cpu:0
# interpreter (and through Metal on macOS when it is exposed); the full GPU tests stay on the test machines
# (tools/remote).
#
# Publishing to PyPI: only when pushing a `v*` tag, and only after declaring this repository as a
# "trusted publisher" of the gpusync and gpusync-gfx projects on pypi.org (GitHub environment `pypi`).

name: CI

on:
  push:
    branches: [main, new-rust]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        run: python -m pip install "maturin>=1.16,<2" "flit_core>=3.10,<4" "pytest>=8" "numpy>=1.22"
      - name: Build (library and engine, editable mode)
        run: |
          python -m pip install --no-build-isolation -e .
          python -m pip install --no-build-isolation --no-deps -e gfx
      - name: Diagnostic
        run: python -m gpusync
      - name: cargo test
        run: cargo test --workspace -q
      - name: Library tests
        run: python -m pytest -q -ra tests

  gfx:
    # The engine runs large simulations: too slow on the interpreter, tested where a GPU is exposed (Metal)
    name: Engine tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install "maturin>=1.16,<2" "flit_core>=3.10,<4" "pytest>=8" "numpy>=1.22"
      - run: |
          python -m pip install --no-build-isolation -e .
          python -m pip install --no-build-isolation --no-deps -e gfx
      - run: python -m gpusync
      - run: python -m pytest -q -ra gfx/tests

  wheels:
    name: Wheel ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - name: The wheel installs and finds its devices
        shell: bash
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP" && python -m gpusync
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: Source archive and engine wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: gpusync-gfx (sources and wheel)
        run: |
          python -m pip install build
          python -m build --outdir dist gfx
      - uses: actions/upload-artifact@v4
        with:
          name: sdist-and-gfx
          path: dist/*

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, gfx, wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: no PyPI token stored in the repository
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
