# Tests on the three systems. GitHub machines have no compute GPU: the tests go through the cpu:0 interpreter
# (and through Metal on macOS when it is exposed); the full GPU tests stay on the test machines (tools/remote).
#
# Never run automatically: start it by hand before a release (Actions → CI → Run workflow, or
# `gh workflow run ci.yml`).

name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        run: python -m pip install "maturin>=1.16,<2" "flit_core>=3.10,<4" "pytest>=8" "numpy>=1.22"
      - name: Build (library and engine, editable mode)
        run: |
          python -m pip install --no-build-isolation -e .
          python -m pip install --no-build-isolation --no-deps -e gfx
      - name: Diagnostic and self-test
        run: python -m gpusync --check
      - name: cargo test
        run: cargo test --workspace -q
      - name: Library tests
        run: python -m pytest -q -ra tests

  gfx:
    # The engine runs large simulations: too slow on the interpreter, tested where a GPU is exposed (Metal)
    name: Engine tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install "maturin>=1.16,<2" "flit_core>=3.10,<4" "pytest>=8" "numpy>=1.22"
      - run: |
          python -m pip install --no-build-isolation -e .
          python -m pip install --no-build-isolation --no-deps -e gfx
      - run: python -m gpusync --check
      - run: python -m pytest -q -ra gfx/tests
