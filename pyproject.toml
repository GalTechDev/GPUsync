[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpusync"
version = "1.0.0"
description = "A Just-In-Time compiled, asynchronous Out-of-Core GPU programming library for Python."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "GalTechDev", email = "poussigalitv@gmail.com"},
    {name = "ThePhoenix78", email = "thephoenix788@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.22.0",
    "pyopencl>=2022.1",
    "cupy-cuda12x>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "sympy>=1.13.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.20.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "tests/mmts/*",
]
builtins = [
    "get_global_id", "get_local_id", "get_group_id", "get_local_size", "barrier",
    "vload4", "vstore4", "atomic_add", "atomic_add_float", "atomic_add_float_global",
    "atomic_min_float_global", "dot", "dot_acc_sat"
]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
